name: TrainVault CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          TRAINVAULT_PASSWORD: ci-only-password
          TRAINVAULT_SESSION_SECRET: ci-only-session-secret-that-is-long-enough-for-tests

  garmin-bridge:
    name: Garmin bridge checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/garmin-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/garmin-bridge/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m pytest
      - run: python -m compileall app
      - name: Build production bridge image
        run: docker build -t trainvault-garmin-bridge:ci .
      - name: Smoke-test production bridge health
        run: |
          docker run -d --name trainvault-garmin-ci \
            -e GARMIN_BRIDGE_API_TOKEN=ci-server-secret \
            -e GARMIN_BRIDGE_ENV=production \
            -e GARMIN_BRIDGE_HOST=0.0.0.0 \
            -e PORT=8765 \
            -p 8765:8765 \
            trainvault-garmin-bridge:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs trainvault-garmin-ci
          exit 1
