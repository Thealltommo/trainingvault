[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trainvault-garmin-bridge"
version = "0.1.0"
description = "Private Garmin Connect adapter for TrainVault"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "garminconnect[workout]>=0.3.7,<0.4",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[project.scripts]
trainvault-garmin-login = "app.login:main"
trainvault-garmin-bridge = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
